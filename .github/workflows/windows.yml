name: Jeu Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Construire le jeu Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier la conduite et les circuits
        run: npm test
      - name: Piloter les spéciales sans téléportation
        run: |
          npm run test:driving
          RALLY_DRIVER_CAR=alpine npm run test:driving -- alps-1 dakar-1
      - name: Vérifier menus, caméras et progression
        run: npm run test:browser
      - name: Construire installateur, portable et version navigateur
        shell: bash
        run: |
          set +e
          npm run dist:win > build.log 2>&1
          build_status=$?
          cat build.log
          {
            echo '### Compilation Windows'
            echo '```text'
            tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"
      - name: Vérifier le fichier HTML sans réseau
        run: npm run test:offline
      - name: Télécharger l’installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installation
          if-no-files-found: error
          retention-days: 30
          path: dist/Rally-Horizon-3D-Installation.exe
      - name: Télécharger la version portable
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          if-no-files-found: error
          retention-days: 30
          path: dist/Rally-Horizon-3D-Windows.exe
      - name: Télécharger la version navigateur
        uses: actions/upload-artifact@v4
        with:
          name: Navigateur-Hors-Ligne
          if-no-files-found: error
          retention-days: 30
          path: dist/Rally-Horizon-3D.html
